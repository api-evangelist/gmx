openapi: 3.2.0
info:
  title: '@gmx-io/gmx-public-api Paxos Transit API'
  version: 1.0.0
  license:
    name: Copyright
  contact: {}
servers:
- url: /v1
tags:
- name: Paxos Transit
paths:
  /paxos/transit/routes:
    get:
      operationId: GetRoutes
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaxosResponseBody'
        '404':
          description: Not Found - Paxos Transit is not enabled on this chain
        '502':
          description: Bad Gateway - Paxos request failed
      description: 'Conversion routes available in Paxos Transit.

        minOrderSize differs per fee tier, pass feeTier=zeroFee for the zero fee minimums.'
      tags:
      - Paxos Transit
      security: []
      parameters:
      - in: query
        name: filter
        required: false
        schema:
          type: string
      - in: query
        name: feeTier
        required: false
        schema:
          $ref: '#/components/schemas/TransitFeeTier'
      summary: Get routes
      x-summary-source: derived
  /paxos/transit/fee-tier:
    get:
      operationId: GetFeeTier
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransitFeeTierResponse'
        '404':
          description: Not Found - Paxos Transit is not enabled on this chain
      description: 'zeroFee for whitelisted addresses, standardFee for everyone else.

        zeroFeeCapacity: max USDC to USDG zero fee amount (USDG base units), refreshed every minute; 0 for standardFee.'
      tags:
      - Paxos Transit
      security: []
      parameters:
      - in: query
        name: userAddress
        required: true
        schema:
          type: string
      summary: Get fee tier
      x-summary-source: derived
  /paxos/transit/authorization:
    get:
      operationId: GetAuthorization
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaxosResponseBody'
        '404':
          description: Not Found - Paxos Transit is not enabled on this chain
        '502':
          description: Bad Gateway - Paxos request failed
      description: Whether the offer token needs a permit signature or an approval before the quote.
      tags:
      - Paxos Transit
      security: []
      parameters:
      - in: query
        name: userAddress
        required: true
        schema:
          type: string
      - in: query
        name: tokenAddress
        required: true
        schema:
          type: string
      - in: query
        name: spenderAddress
        required: true
        schema:
          type: string
      - in: query
        name: amount
        required: true
        schema:
          type: string
      - in: query
        name: chainId
        required: true
        schema:
          format: double
          type: number
      summary: Get authorization
      x-summary-source: derived
  /paxos/transit/orders/quote:
    get:
      operationId: GetQuote
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaxosResponseBody'
        '400':
          description: Bad Request - zero fee is not available for this route
        '403':
          description: Forbidden - userAddress is not whitelisted for zero fee
        '404':
          description: Not Found - Paxos Transit is not enabled on this chain
        '409':
          description: Conflict - zero fee capacity is not available now
        '502':
          description: Bad Gateway - Paxos request failed
      description: Signed submitOrder calldata. feeTier=zeroFee needs a whitelisted address, the USDC/USDG route on this chain and enough capacity.
      tags:
      - Paxos Transit
      security: []
      parameters:
      - in: query
        name: userAddress
        required: true
        schema:
          type: string
      - in: query
        name: offerAsset
        required: true
        schema:
          type: string
      - in: query
        name: wantAsset
        required: true
        schema:
          type: string
      - in: query
        name: offerAmount
        required: true
        schema:
          type: string
      - in: query
        name: sourceChainId
        required: true
        schema:
          format: double
          type: number
      - in: query
        name: destinationChainId
        required: true
        schema:
          format: double
          type: number
      - in: query
        name: permitSignature
        required: false
        schema:
          type: string
      - in: query
        name: permitDeadline
        required: false
        schema:
          format: double
          type: number
      - in: query
        name: responseFormat
        required: false
        schema:
          $ref: '#/components/schemas/TransitResponseFormat'
      - in: query
        name: feeTier
        required: false
        schema:
          $ref: '#/components/schemas/TransitFeeTier'
      summary: Get quote
      x-summary-source: derived
  /paxos/transit/orders/{orderId}:
    get:
      operationId: GetOrder
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaxosResponseBody'
        '404':
          description: Not Found - Paxos Transit is not enabled on this chain
        '502':
          description: Bad Gateway - Paxos request failed
      description: Status of one Paxos Transit order.
      tags:
      - Paxos Transit
      security: []
      parameters:
      - in: path
        name: orderId
        required: true
        schema:
          type: string
      summary: Get order
      x-summary-source: derived
  /paxos/transit/orders:
    get:
      operationId: GetOrders
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaxosResponseBody'
        '404':
          description: Not Found - Paxos Transit is not enabled on this chain
        '502':
          description: Bad Gateway - Paxos request failed
      description: Paxos Transit order history of a user.
      tags:
      - Paxos Transit
      security: []
      parameters:
      - in: query
        name: userAddress
        required: true
        schema:
          type: string
      - in: query
        name: pageSize
        required: false
        schema:
          format: double
          type: number
      - in: query
        name: pageToken
        required: false
        schema:
          type: string
      - in: query
        name: filter
        required: false
        schema:
          type: string
      summary: Get orders
      x-summary-source: derived
components:
  schemas:
    TransitResponseFormat:
      type: string
      enum:
      - encoded
      - full
      - structured
    TransitFeeTier:
      type: string
      enum:
      - zeroFee
      - standardFee
    PaxosResponseBody:
      $ref: '#/components/schemas/Record_string.unknown_'
    TransitFeeTierResponse:
      properties:
        zeroFeeCapacity:
          type: string
        feeTier:
          $ref: '#/components/schemas/TransitFeeTier'
      required:
      - zeroFeeCapacity
      - feeTier
      type: object
    Record_string.unknown_:
      properties: {}
      additionalProperties: {}
      type: object
      description: Construct a type with a set of properties K of type T
