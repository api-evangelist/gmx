openapi: 3.2.0
info:
  title: '@gmx-io/gmx-public-api Markets API'
  version: 1.0.0
  license:
    name: Copyright
  contact: {}
servers:
- url: /v1
tags:
- name: Markets
paths:
  /markets:
    get:
      operationId: GetMarkets
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/MarketWithTiersResponse'
                type: array
        '500':
          description: Internal Server Error
      tags:
      - Markets
      security: []
      parameters: []
      summary: Get markets
      x-summary-source: derived
  /markets/tickers:
    get:
      operationId: GetMarketsTickers
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/MarketTickerResponse'
                type: array
        '400':
          description: Bad Request - Invalid market addresses or symbols
        '500':
          description: Internal Server Error
      tags:
      - Markets
      security: []
      parameters:
      - in: query
        name: addresses
        required: false
        schema:
          type: array
          items:
            type: string
      - in: query
        name: symbols
        required: false
        schema:
          type: array
          items:
            type: string
      summary: Get markets tickers
      x-summary-source: derived
  /markets/trading-capacity:
    get:
      operationId: GetTradingCapacity
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradingCapacityResponse'
        '400':
          description: Bad Request - Invalid market symbol or direction
        '404':
          description: Market not found
        '500':
          description: Internal Server Error
      tags:
      - Markets
      security: []
      parameters:
      - in: query
        name: symbol
        required: true
        schema:
          type: string
      - in: query
        name: direction
        required: true
        schema:
          type: string
          enum:
          - long
          - short
      summary: Get trading capacity
      x-summary-source: derived
  /markets/info:
    get:
      operationId: GetMarketsInfo
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/MarketInfoResponse'
                type: array
        '500':
          description: Internal Server Error
      tags:
      - Markets
      security: []
      parameters: []
      summary: Get markets info
      x-summary-source: derived
  /markets/config:
    get:
      operationId: GetMarketsConfig
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/MarketConfigResponse'
                type: array
        '500':
          description: Internal Server Error
      tags:
      - Markets
      security: []
      parameters: []
      summary: Get markets config
      x-summary-source: derived
  /markets/values:
    get:
      operationId: GetMarketsValues
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/MarketValuesResponse'
                type: array
        '500':
          description: Internal Server Error
      tags:
      - Markets
      security: []
      parameters: []
      summary: Get markets values
      x-summary-source: derived
